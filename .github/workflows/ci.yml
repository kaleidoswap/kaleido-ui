name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    # Windows too: a CRLF checkout of DESIGN.md once failed the build there and
    # nowhere else.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22, not 20: `npm test` passes the glob quoted, and node --test only
          # expands globs itself from 21. cmd.exe, npm's shell on Windows, never does.
          node-version: 22
          cache: npm

      # `npm ci`, not `npm install`: it fails when package.json and the
      # lockfile disagree, which is what let the lockfile drift unnoticed.
      - name: Install dependencies
        run: npm ci

      - name: Validate types
        run: npm run type-check

      - name: Build package
        run: npm run build

      # A locale that groups 1000 as "1.000" — amounts must not follow it.
      - name: Test
        run: npm test
        env:
          LANG: it_IT.UTF-8
          LC_ALL: it_IT.UTF-8
